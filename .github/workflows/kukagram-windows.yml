name: Kukagram Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kukagram-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      OPEN_API_ID: "611335"
      OPEN_API_HASH: "d524b414d21f4d37f08684c1df41ac9c"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Keep line endings.
        run: git config --global core.autocrlf false

      - name: Free disk space.
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Get-PSDrive C, D | Format-Table Name, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          $dirs = @(
            'C:\Android',
            'C:\ghcup',
            'C:\Miniconda',
            'C:\Strawberry',
            'C:\Julia',
            'C:\SeleniumWebDrivers',
            'C:\tools\php',
            'C:\msys64',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files\R',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files (x86)\Android'
          )
          foreach ($dir in $dirs) {
            if (Test-Path $dir) { cmd /c "rmdir /s /q `"$dir`"" }
          }
          Get-PSDrive C, D | Format-Table Name, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Apply Kukagram lib_ui patch.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          sh kukagram-patches/apply-lib_ui.sh

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "kukagram@example.com"
          git config --global user.name "Kukagram CI"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: kukagram-win-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            kukagram-win-third-party-${{ env.CACHE_KEY }}-
            kukagram-win-third-party-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: kukagram-win-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            kukagram-win-libs-${{ env.CACHE_KEY }}-
            kukagram-win-libs-

      - name: Rebuild trimmed Rust sources.
        run: |
          if not exist %LibrariesPath%\tdesktop_rust\out\src\wallet_engine\wallet_engine.cpp (
            for %%s in (tlottie wallet-engine tdesktop_rust) do (
              if exist %LibrariesPath%\cache_keys\%%s del %LibrariesPath%\cache_keys\%%s
            )
          )
          if not exist %LibrariesPath%\tlottie\Cargo.toml (
            for %%s in (tlottie wallet-engine tdesktop_rust) do (
              if exist %LibrariesPath%\cache_keys\%%s del %LibrariesPath%\cache_keys\%%s
            )
          )

      - name: Libraries.
        id: libraries
        timeout-minutes: 290
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6 skip-crash-reports

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/mkspecs/*' -o -path '*/plugins/*' -o -path '*/translations/*' -o -path '*/tdesktop_rust/*' -o -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: kukagram-win-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: kukagram-win-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Kukagram.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 qt6 ^
          -D TDESKTOP_API_ID=%OPEN_API_ID% ^
          -D TDESKTOP_API_HASH=%OPEN_API_HASH% ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if %errorlevel% neq 0 exit /b 1

          cmake --build ..\out --config Release --target Telegram --parallel
          if %errorlevel% neq 0 exit /b 1

      - name: Package.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir dist\kukagram
          copy %OUT%\kukagram.exe dist\kukagram\
          if exist %OUT%\modules xcopy /E /I /Y %OUT%\modules dist\kukagram\modules
          cd dist
          7z a ..\kukagram-windows-x64.zip kukagram

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: kukagram-windows-x64
          path: kukagram-windows-x64.zip
          retention-days: 14

      - name: Attach to release.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Kukagram builds for Windows and macOS."
          gh release upload "$GITHUB_REF_NAME" kukagram-windows-x64.zip -R "$GITHUB_REPOSITORY" --clobber
